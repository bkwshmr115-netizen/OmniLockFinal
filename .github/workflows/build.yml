name: Build OmniLock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

    - name: Install Cordova & Dependencies
      run: |
        npm install -g cordova
        npm install || true

    - name: Prepare and Build Android
      run: |
        cordova platform add android || cordova platform rm android && cordova platform add android
        cordova build android --device --debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Official-App-APK
        path: platforms/android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
